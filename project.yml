# XcodeGen manifest (ADR-004). The Xcode project is generated from this file on the
# build machine; no .xcodeproj is committed. Signing is applied by builder's
# ios-build.yml workflow at build time, so none is configured here.
name: ScanLab
options:
  bundleIdPrefix: com.nbs1997
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en-AU
  createIntermediateGroups: true

packages:
  ScanLabCore:
    path: Packages/ScanLabCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ScanLab:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      # The reference object's true shape and feature table, read by the accuracy
      # check (unit U10). Bundled straight from the script's output so they can
      # never drift from what was printed (ADR-010).
      - path: reference-object/output/reference-object.stl
        buildPhase: resources
      - path: reference-object/output/feature-table.json
        buildPhase: resources
    dependencies:
      - package: ScanLabCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ScanLab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Required before the camera is used in later Bolts (constraint RC1).
        NSCameraUsageDescription: ScanLab uses the camera and LiDAR scanner to capture 3D scans of objects.
        # Only the platform's own encryption is used (constraint RC3).
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nbs1997.scanlab
        PRODUCT_NAME: ScanLab
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        # The build-date script below edits the built Info.plist, which the script
        # sandbox would otherwise block.
        ENABLE_USER_SCRIPT_SANDBOXING: false
    postBuildScripts:
      - name: Stamp build date
        basedOnDependencyAnalysis: false
        # Writes the UTC build time into the app's Info.plist as SLBuildDate, which
        # the Diagnostics screen uses to show days until the TestFlight build expires
        # (FR-1.3). Runs before code signing, so the signature covers it.
        script: |
          set -euo pipefail
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          /usr/libexec/PlistBuddy -c "Delete :SLBuildDate" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :SLBuildDate string $STAMP" "$PLIST"
          echo "Stamped SLBuildDate=$STAMP"

schemes:
  ScanLab:
    build:
      targets:
        ScanLab: all
    archive:
      config: Release
